name: ritim
description: "Ritim - Genç kızlar için döngü takip ve ruh hali günlüğü"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Navigasyon
  go_router: ^15.1.2

  # State management — flutter_riverpod seçildi:
  # provider'a kıyasla derleme zamanı tip güvenliği sağlar,
  # BuildContext gerektirmez, feature-bazlı mimariye daha uygun,
  # ve auto-dispose ile bellek yönetimi otomatiktir.
  flutter_riverpod: ^2.6.1

  # Tipografi
  google_fonts: ^6.2.1

  # Tarih/saat formatlama ve Türkçe locale desteği
  intl: ^0.20.2
  flutter_secure_storage: ^11.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  share_plus: ^13.3.0
  file_picker: ^12.2.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
